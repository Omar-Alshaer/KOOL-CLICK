<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="application-name" content="Kool Click" />
    <meta name="theme-color" content="#3d005f" />
    <meta name="color-scheme" content="light" />
    <meta property="og:site_name" content="Kool Click" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kool Click | Manager Catalog" />
    <meta
      property="og:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta property="og:image" content="/public/assets/brand/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kool Click | Manager Catalog" />
    <meta
      name="twitter:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="twitter:image" content="/public/assets/brand/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/public/assets/brand/logo.svg" />
    <link rel="apple-touch-icon" href="/public/assets/brand/logo.svg" />
    <link rel="manifest" href="/public/site.webmanifest" />
    <title>Kool Click | Manager Catalog</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <main class="kc-shell">
      <header id="kcHeader"></header>

      <section class="kc-card kc-section-spaced-sm">
        <div class="kc-inline" style="justify-content: space-between; flex-wrap: wrap">
          <div>
            <h2 class="kc-title">Products Catalog</h2>
            <p class="kc-subtitle">View items grouped by sections like the student view.</p>
          </div>
          <div id="managerMini"></div>
        </div>
      </section>

      <section class="kc-card kc-section-spaced-sm">
        <h3 class="kc-title">Products</h3>
        <div id="catalogTabs" class="kc-category-tabs"></div>
        <div id="catalogRoot" class="kc-section-spaced-sm"></div>
      </section>
    </main>

    <div id="catalogEditModal" class="kc-modal" aria-hidden="true">
      <div class="kc-modal-frame" role="dialog" aria-modal="true" aria-label="Edit Product">
        <div class="kc-modal-head">
          <h3 class="kc-title" style="margin: 0">Edit Product</h3>
          <button id="closeCatalogModalBtn" type="button" class="kc-btn-secondary">Close</button>
        </div>
        <form id="catalogEditForm" class="kc-form">
          <input type="hidden" id="catalogEditId" />
          <div class="kc-two">
            <div>
              <label for="catalogEditName">Product Name</label>
              <input id="catalogEditName" type="text" required />
            </div>
            <div>
              <label for="catalogEditCategory">Category</label>
              <select id="catalogEditCategorySelect"></select>
              <input
                id="catalogEditCategoryInput"
                type="text"
                placeholder="Write new category"
                class="kc-hidden"
              />
            </div>
            <div>
              <label for="catalogEditDescription">Description</label>
              <input id="catalogEditDescription" type="text" />
            </div>
            <div>
              <label for="catalogEditPrice">Price (EGP)</label>
              <input id="catalogEditPrice" type="number" min="1" step="0.5" required />
            </div>
            <div>
              <label for="catalogEditOldPrice">Old Price (EGP)</label>
              <input id="catalogEditOldPrice" type="number" min="0" step="0.5" />
            </div>
            <div>
              <label for="catalogEditDiscount">Discount (%)</label>
              <input id="catalogEditDiscount" type="number" min="0" max="90" step="1" />
            </div>
            <div>
              <label for="catalogEditBadge">Badge</label>
              <select id="catalogEditBadge">
                <option value="">None</option>
                <option value="Spicy">Spicy</option>
                <option value="New">New</option>
                <option value="Popular">Popular</option>
                <option value="Best Seller">Best Seller</option>
              </select>
            </div>
            <div>
              <label for="catalogEditBestSeller">Best Seller</label>
              <select id="catalogEditBestSeller">
                <option value="false">No</option>
                <option value="true">Yes</option>
              </select>
            </div>
            <div>
              <label for="catalogEditImage">Replace Image</label>
              <div class="kc-file-field">
                <input id="catalogEditImage" type="file" accept="image/*" />
                <button type="button" id="catalogEditImageBtn" class="kc-btn-secondary">
                  Choose Image
                </button>
                <span id="catalogEditImageName" class="kc-muted">No file selected</span>
              </div>
            </div>
            <div>
              <label for="catalogEditActive">Status</label>
              <select id="catalogEditActive">
                <option value="true">Active</option>
                <option value="false">Inactive</option>
              </select>
            </div>
          </div>
          <div class="kc-register-actions">
            <input type="submit" value="Save Changes" />
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="../../app/features/manager/ui/manager-products-view.js"></script>
  </body>
</html>
