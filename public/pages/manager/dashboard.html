<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="application-name" content="Kool Click" />
    <meta name="theme-color" content="#3d005f" />
    <meta name="color-scheme" content="light" />
    <meta property="og:site_name" content="Kool Click" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kool Click | Manager Dashboard" />
    <meta
      property="og:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta property="og:image" content="/public/assets/brand/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kool Click | Manager Dashboard" />
    <meta
      name="twitter:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="twitter:image" content="/public/assets/brand/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/public/assets/brand/logo.svg" />
    <link rel="apple-touch-icon" href="/public/assets/brand/logo.svg" />
    <link rel="manifest" href="/public/site.webmanifest" />
    <title>Kool Click | Manager Dashboard</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <main class="kc-shell">
      <header id="kcHeader"></header>

      <section class="kc-card kc-section-spaced-sm">
        <div class="kc-inline" style="justify-content: space-between; flex-wrap: wrap">
          <div>
            <h2 class="kc-title">Manager Dashboard</h2>
            <p class="kc-subtitle">Track revenue, orders, and popular products.</p>
          </div>
          <div id="managerMini"></div>
        </div>
      </section>

      <section class="kc-grid kc-section-spaced-sm">
        <div class="kc-card">
          <strong>Total Orders</strong>
          <div id="mgrTotalOrders" class="kc-title">0</div>
        </div>
        <div class="kc-card">
          <strong>Collected Orders</strong>
          <div id="mgrCollectedOrders" class="kc-title">0</div>
        </div>
        <div class="kc-card">
          <strong>Pending Orders</strong>
          <div id="mgrPendingOrders" class="kc-title">0</div>
        </div>
        <div class="kc-card">
          <strong>Preparing Orders</strong>
          <div id="mgrPreparingOrders" class="kc-title">0</div>
        </div>
        <div class="kc-card">
          <strong>Ready Orders</strong>
          <div id="mgrReadyOrders" class="kc-title">0</div>
        </div>
        <div class="kc-card">
          <strong>Total Revenue</strong>
          <div id="mgrRevenue" class="kc-title">0</div>
        </div>
        <div class="kc-card">
          <strong>Items Sold</strong>
          <div id="mgrItemsSold" class="kc-title">0</div>
        </div>
      </section>

      <section class="kc-card kc-section-spaced-sm">
        <h3 class="kc-title">Top Products</h3>
        <div id="mgrTopItems" class="kc-inline" style="flex-wrap: wrap; gap: 0.45rem"></div>
      </section>
    </main>

    <script type="module" src="../../app/features/manager/ui/manager-dashboard.js"></script>
  </body>
</html>
