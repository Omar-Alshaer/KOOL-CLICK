<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="application-name" content="Kool Click" />
    <meta name="theme-color" content="#3d005f" />
    <meta name="color-scheme" content="light" />
    <meta property="og:site_name" content="Kool Click" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kool Click | Manager Login" />
    <meta
      property="og:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta property="og:image" content="/public/assets/brand/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kool Click | Manager Login" />
    <meta
      name="twitter:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="twitter:image" content="/public/assets/brand/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/public/assets/brand/logo.svg" />
    <link rel="apple-touch-icon" href="/public/assets/brand/logo.svg" />
    <link rel="manifest" href="/public/site.webmanifest" />
    <title>Kool Click | Manager Login</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <main class="kc-shell">
      <header id="kcHeader" class="kc-login-header">
        <div class="kc-brand">
          <img src="../../assets/brand/logo_trans.svg" alt="Kool Click" />
        </div>
      </header>

      <section class="kc-register-hero">
        <h1 class="kc-register-hero-title">Manager Access</h1>
        <p class="kc-register-hero-subtitle">
          Login to manage your restaurant products, offers, and reports.
        </p>
        <div class="kc-register-rules">
          <span class="kc-chip">Products & Pricing</span>
          <span class="kc-chip">Offers & Promo Codes</span>
          <span class="kc-chip">Revenue Analytics</span>
        </div>
      </section>

      <section class="kc-card kc-login-card">
        <h2 class="kc-title">Manager Login</h2>
        <p class="kc-subtitle">Use your phone number and password.</p>

        <form id="managerLoginForm" class="kc-form kc-login-form">
          <div class="kc-login-field">
            <label for="phone">Phone Number</label>
            <input
              id="phone"
              name="phone"
              type="tel"
              placeholder="Enter your phone number"
              autocomplete="username"
              required
            />
          </div>

          <div class="kc-login-field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              minlength="6"
              required
            />
          </div>

          <div class="kc-register-actions">
            <input type="submit" value="Login" />
          </div>
        </form>
      </section>

      <section style="display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; padding: 2rem 1rem;">
        <a href="../clicker/login.html" class="kc-btn" style="padding: 0.35rem 0.6rem; font-size: 12px; min-height: auto;">🍔 Clicker</a>
        <a href="../admin/login.html" class="kc-btn" style="padding: 0.35rem 0.6rem; font-size: 12px; min-height: auto;">👤 Admin</a>
        <a href="../cashier/login.html" class="kc-btn" style="padding: 0.35rem 0.6rem; font-size: 12px; min-height: auto;">💳 Cashier</a>
      </section>
    </main>

    <script type="module" src="../../app/features/manager/ui/manager-login.js"></script>
  </body>
</html>
