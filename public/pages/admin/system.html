<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kool Click | System Owner</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <main class="kc-shell">
      <header id="kcHeader"></header>

      <section class="kc-card kc-section-spaced-sm">
        <div class="kc-inline" style="justify-content: space-between; flex-wrap: wrap;">
          <div>
            <h2 class="kc-title">System Ownership</h2>
            <p class="kc-subtitle">Manage users, roles, and audit visibility.</p>
          </div>
          <div id="adminMini"></div>
        </div>
      </section>

      <section class="kc-grid kc-section-spaced-sm">
        <div class="kc-card">
          <h3 class="kc-title">Create User</h3>
          <form id="createUserForm" class="kc-form">
            <label>
              Role
              <select name="role" required>
                <option value="clicker">clicker</option>
                <option value="cashier">cashier</option>
                <option value="manager">manager</option>
                <option value="admin">admin</option>
              </select>
            </label>
            <label>
              Display Name
              <input name="displayName" type="text" maxlength="120" required />
            </label>
            <label data-email-field>
              Email
              <input name="email" type="email" autocomplete="off" />
            </label>
            <label>
              Phone
              <input name="phone" type="tel" autocomplete="off" />
            </label>
            <label data-restaurant-field>
              Restaurant ID
              <input name="restaurantId" type="text" autocomplete="off" />
            </label>
            <label data-restaurant-field>
              Restaurant Name
              <input name="restaurantName" type="text" autocomplete="off" />
            </label>
            <label>
              Temporary Password
              <input name="password" type="password" autocomplete="new-password" minlength="8" required />
            </label>
            <button class="kc-btn" type="submit">Create User</button>
          </form>
        </div>

        <div class="kc-card">
          <div class="kc-inline" style="justify-content: space-between; flex-wrap: wrap;">
            <h3 class="kc-title">Managed Users</h3>
            <button id="refreshAdminData" class="kc-btn kc-btn-secondary" type="button">Refresh</button>
          </div>
          <div id="adminUsersList"></div>
        </div>
      </section>

      <section class="kc-card kc-section-spaced-sm">
        <h3 class="kc-title">Audit Trail</h3>
        <div id="adminAuditList"></div>
      </section>
    </main>

    <div id="roleModal" class="kc-feedback-modal" hidden aria-hidden="true">
      <div class="kc-modal-frame" role="dialog" aria-modal="true" aria-labelledby="roleModalTitle">
        <div class="kc-inline" style="justify-content: space-between;">
          <h3 id="roleModalTitle" class="kc-title">Edit User Role</h3>
          <button id="roleModalClose" class="kc-btn kc-btn-secondary" type="button">Close</button>
        </div>
        <form id="roleEditForm" class="kc-form">
          <input name="targetUid" type="hidden" />
          <label>
            Role
            <select name="role" required>
              <option value="clicker">clicker</option>
              <option value="cashier">cashier</option>
              <option value="manager">manager</option>
              <option value="admin">admin</option>
            </select>
          </label>
          <label>
            Display Name
            <input name="displayName" type="text" maxlength="120" required />
          </label>
          <label data-email-field>
            Email
            <input name="email" type="email" autocomplete="off" />
          </label>
          <label>
            Phone
            <input name="phone" type="tel" autocomplete="off" />
          </label>
          <label data-restaurant-field>
            Restaurant ID
            <input name="restaurantId" type="text" autocomplete="off" />
          </label>
          <label data-restaurant-field>
            Restaurant Name
            <input name="restaurantName" type="text" autocomplete="off" />
          </label>
          <div class="kc-inline">
            <button class="kc-btn" type="submit">Save Role</button>
            <button id="roleModalCancel" class="kc-btn kc-btn-secondary" type="button">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="../../js/admin-system.js"></script>
  </body>
</html>
