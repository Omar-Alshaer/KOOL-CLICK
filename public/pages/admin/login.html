<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kool Click | System Owner Login</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <main class="kc-shell">
      <section class="kc-card kc-section-spaced-sm" style="max-width: 460px; margin: 8vh auto;">
        <div class="kc-center">
          <img src="../../assets/brand/logo_trans.svg" alt="Kool Click Logo" style="max-width: 160px;" />
          <h1 class="kc-title">System Owner</h1>
          <p class="kc-subtitle">Restricted superAdmin access.</p>
        </div>

        <form id="adminLoginForm" class="kc-form">
          <label>
            Email
            <input name="email" type="email" autocomplete="username" required />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="kc-btn" type="submit">Sign In</button>
        </form>
      </section>
    </main>

    <script type="module" src="../../app/features/admin/ui/admin-login.js"></script>
  </body>
</html>
