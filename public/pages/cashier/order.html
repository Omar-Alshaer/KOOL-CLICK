<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="application-name" content="Kool Click" />
    <meta name="theme-color" content="#3d005f" />
    <meta name="color-scheme" content="light" />
    <meta property="og:site_name" content="Kool Click" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kool Click | Order" />
    <meta
      property="og:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta property="og:image" content="/public/assets/brand/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kool Click | Order" />
    <meta
      name="twitter:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="twitter:image" content="/public/assets/brand/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/public/assets/brand/logo.svg" />
    <link rel="apple-touch-icon" href="/public/assets/brand/logo.svg" />
    <link rel="manifest" href="/public/site.webmanifest" />
    <title>Kool Click | Order</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <main class="kc-shell">
      <header id="kcHeader"></header>

      <section class="kc-card kc-section-spaced">
        <h1 class="kc-title">Order</h1>
        <div id="cashierMini"></div>
      </section>

      <section class="kc-card kc-section-spaced">
        <div class="kc-grid">
          <div class="kc-item">
            <h2 class="kc-title kc-title-tight">Find Order</h2>
            <div class="kc-inline">
              <input
                id="orderSearchInput"
                class="kc-cashier-field"
                type="text"
                placeholder="Enter Order ID or KC-XXXX"
              />
              <button id="orderSearchBtn" type="button">Find</button>
              <button id="orderRefreshBtn" type="button" class="kc-btn-secondary">Refresh</button>
            </div>
          </div>

          <div class="kc-item">
            <h2 class="kc-title kc-title-tight">Current List</h2>
            <select
              id="orderPicker"
              class="kc-cashier-field kc-field-full"
              aria-label="Current order list"
            ></select>
          </div>
        </div>
      </section>

      <section id="orderRoot" class="kc-grid kc-section-spaced"></section>
    </main>

    <script type="module" src="../../app/features/cashier/ui/cashier-order.js"></script>
  </body>
</html>
