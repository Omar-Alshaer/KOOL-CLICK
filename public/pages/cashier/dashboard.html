<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="application-name" content="Kool Click" />
    <meta name="theme-color" content="#3d005f" />
    <meta name="color-scheme" content="light" />
    <meta property="og:site_name" content="Kool Click" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kool Click | Cashier Dashboard" />
    <meta
      property="og:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta property="og:image" content="/public/assets/brand/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kool Click | Cashier Dashboard" />
    <meta
      name="twitter:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="twitter:image" content="/public/assets/brand/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/public/assets/brand/logo.svg" />
    <link rel="apple-touch-icon" href="/public/assets/brand/logo.svg" />
    <link rel="manifest" href="/public/site.webmanifest" />
    <title>Kool Click | Cashier Dashboard</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <main class="kc-shell">
      <header id="kcHeader"></header>

      <section class="kc-card kc-section-spaced">
        <h1 class="kc-title">Cashier Dashboard</h1>
        <div id="cashierMini"></div>
      </section>

      <section class="kc-card kc-cashier-toolbar kc-section-spaced">
        <h2 class="kc-title">Quick Controls</h2>
        <div id="cashierStats" class="kc-cashier-stats"></div>
        <div class="kc-cashier-controls">
          <div class="kc-item">
            <h3 class="kc-title kc-title-tight-sm">Scan QR / Find Order</h3>
            <div class="kc-inline">
              <input
                id="scanInput"
                class="kc-cashier-field"
                type="text"
                placeholder="Scan QR payload or enter Order ID"
              />
              <button id="scanFindBtn" type="button">Find</button>
              <button id="scanOpenBtn" type="button" class="kc-btn-secondary">Open Camera</button>
            </div>
          </div>

          <div class="kc-item">
            <h3 class="kc-title kc-title-tight-sm">Manual Filter</h3>
            <div class="kc-inline">
              <input
                id="orderSearch"
                class="kc-cashier-field"
                type="text"
                placeholder="Search by ID / student"
              />
              <select id="sortBy" class="kc-cashier-field">
                <option value="time">Sort by time</option>
                <option value="name">Sort by student name</option>
              </select>
              <label class="kc-inline kc-inline-zero">
                <input id="showCompleted" type="checkbox" />
                <span>Show collected</span>
              </label>
            </div>
          </div>
        </div>
      </section>

      <section id="ordersRoot" class="kc-grid kc-section-spaced"></section>
    </main>

    <div id="cashierOrderModal" class="kc-modal-backdrop" hidden>
      <div
        class="kc-modal-frame"
        role="dialog"
        aria-modal="true"
        aria-labelledby="cashierOrderModalTitle"
      >
        <div class="kc-inline kc-inline-between">
          <h3 id="cashierOrderModalTitle" class="kc-title kc-title-no-margin">Order Details</h3>
          <button id="orderModalCloseBtn" type="button" class="kc-btn-danger">Close</button>
        </div>
        <div id="orderModalBody"></div>
      </div>
    </div>

    <div id="cashierScanModal" class="kc-modal-backdrop" hidden>
      <div
        class="kc-modal-frame"
        role="dialog"
        aria-modal="true"
        aria-labelledby="cashierScanModalTitle"
      >
        <div class="kc-inline kc-inline-between">
          <h3 id="cashierScanModalTitle" class="kc-title kc-title-no-margin">Scan QR</h3>
          <button id="scanCloseBtn" type="button" class="kc-btn-danger">Close Camera</button>
        </div>
        <div class="kc-scan-panel">
          <video id="scanVideo" class="kc-scan-video" playsinline muted></video>
          <span id="scanHint" class="kc-muted">Point camera to QR code</span>
        </div>
      </div>
    </div>

    <script type="module" src="../../app/features/cashier/ui/cashier-dashboard.js"></script>
  </body>
</html>
