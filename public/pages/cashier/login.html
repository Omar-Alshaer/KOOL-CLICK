<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="application-name" content="Kool Click" />
    <meta name="theme-color" content="#3d005f" />
    <meta name="color-scheme" content="light" />
    <meta property="og:site_name" content="Kool Click" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kool Click | Cashier Login" />
    <meta
      property="og:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta property="og:image" content="/public/assets/brand/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kool Click | Cashier Login" />
    <meta
      name="twitter:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="twitter:image" content="/public/assets/brand/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/public/assets/brand/logo.svg" />
    <link rel="apple-touch-icon" href="/public/assets/brand/logo.svg" />
    <link rel="manifest" href="/public/site.webmanifest" />
    <title>Kool Click | Cashier Login</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <main class="kc-shell">
      <header class="kc-login-header">
        <div class="kc-brand">
          <img src="../../assets/brand/logo_trans.svg" alt="Kool Click" />
          <div class="kc-brand-text">
            <span class="kc-brand-title">KOOL CLICK</span>
            <span class="kc-brand-slogan">Click. Order. Enjoy.</span>
          </div>
        </div>
      </header>

      <section class="kc-register-hero">
        <h1 class="kc-register-hero-title">Cashier Login</h1>
        <p class="kc-register-hero-subtitle">Manage restaurant orders and delivery handoff.</p>
      </section>

      <section class="kc-card kc-login-card">
        <h2 class="kc-title">Sign In</h2>
        <form id="cashierLoginForm" class="kc-form kc-login-form">
          <div class="kc-login-field">
            <label for="phone">Phone Number</label>
            <input id="phone" type="tel" placeholder="Enter your phone number" required />
          </div>

          <div class="kc-login-field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" required />
          </div>

          <div class="kc-register-actions">
            <input type="submit" value="Login" />
          </div>
        </form>
      </section>
    </main>

    <script type="module" src="../../app/features/cashier/ui/cashier-login.js"></script>
  </body>
</html>
