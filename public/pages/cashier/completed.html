<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="application-name" content="Kool Click" />
    <meta name="theme-color" content="#3d005f" />
    <meta name="color-scheme" content="light" />
    <meta property="og:site_name" content="Kool Click" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kool Click | Completed Orders" />
    <meta
      property="og:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta property="og:image" content="/public/assets/brand/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kool Click | Completed Orders" />
    <meta
      name="twitter:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="twitter:image" content="/public/assets/brand/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/public/assets/brand/logo.svg" />
    <link rel="apple-touch-icon" href="/public/assets/brand/logo.svg" />
    <link rel="manifest" href="/public/site.webmanifest" />
    <title>Kool Click | Completed Orders</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <main class="kc-shell">
      <header id="kcHeader"></header>

      <section class="kc-card kc-section-spaced">
        <h1 class="kc-title">Completed Orders</h1>
        <div id="cashierMini"></div>
      </section>

      <section class="kc-card kc-section-spaced">
        <div class="kc-inline kc-inline-between">
          <h2 class="kc-title kc-title-no-margin">History</h2>
          <input
            id="completedSearch"
            class="kc-cashier-field"
            type="text"
            placeholder="Search by ID / student"
          />
        </div>
        <p class="kc-muted">Orders that were already collected and delivered.</p>
      </section>

      <section id="completedRoot" class="kc-grid kc-section-spaced"></section>
    </main>

    <script type="module" src="../../app/features/cashier/ui/cashier-completed.js"></script>
  </body>
</html>
