<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="application-name" content="Kool Click" />
    <meta name="theme-color" content="#3d005f" />
    <meta name="color-scheme" content="light" />
    <meta property="og:site_name" content="Kool Click" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kool Click | Cart" />
    <meta
      property="og:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta property="og:image" content="/public/assets/brand/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kool Click | Cart" />
    <meta
      name="twitter:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="twitter:image" content="/public/assets/brand/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/public/assets/brand/logo.svg" />
    <link rel="apple-touch-icon" href="/public/assets/brand/logo.svg" />
    <link rel="manifest" href="/public/site.webmanifest" />
    <title>Kool Click | Cart</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <main class="kc-shell">
      <header id="kcHeader"></header>

      <section class="kc-card kc-section-spaced">
        <h1 class="kc-title">Cart</h1>
        <div id="clickerMini"></div>
      </section>

      <section class="kc-card kc-section-spaced">
        <div id="cartRoot"></div>

        <div class="kc-checkout-grid kc-section-spaced-sm">
          <div class="kc-item">
            <strong>Payment Method</strong>
            <div class="kc-payment-options">
              <label class="kc-payment-option">
                <input type="radio" name="paymentMethod" value="CashOnDelivery" checked />
                <span>Cash on Pickup</span>
              </label>
              <label class="kc-payment-option">
                <input type="radio" name="paymentMethod" value="InstaPay" />
                <span>InstaPay + Receipt</span>
              </label>
            </div>

            <div id="receiptSection" class="kc-receipt-panel kc-hidden">
              <label for="receiptFile">Upload InstaPay Receipt</label>
              <div class="kc-inline kc-inline-top-sm">
                <input id="receiptFile" class="kc-receipt-input" type="file" accept="image/*" />
                <button id="receiptChooseBtn" type="button" class="kc-btn-secondary">
                  Choose Receipt Image
                </button>
                <span id="receiptFileName" class="kc-muted kc-receipt-file-name"
                  >No file selected</span
                >
              </div>
              <p class="kc-muted">Receipt is required for InstaPay orders.</p>
            </div>
          </div>

          <div class="kc-item">
            <strong>Promo Code</strong>
            <div class="kc-inline kc-inline-top-md">
              <input
                id="promoCodeInput"
                class="kc-input-compact"
                type="text"
                placeholder="e.g. WELCOME10"
              />
              <button id="applyPromoBtn" type="button">Apply</button>
              <button id="clearPromoBtn" type="button" class="kc-btn-secondary">Clear</button>
            </div>
            <p id="promoSummary" class="kc-muted kc-summary-top">No promo applied.</p>
          </div>
        </div>

        <div class="kc-checkout-totals kc-section-spaced-md">
          <div class="kc-inline kc-inline-between">
            <span>Subtotal</span><strong id="subtotal">0 EGP</strong>
          </div>
          <div class="kc-inline kc-inline-between">
            <span>Promo Discount</span><strong id="discount">0 EGP</strong>
          </div>
          <div class="kc-inline kc-inline-between">
            <span>Offer Applied</span><strong id="offerSummary">No offer applied</strong>
          </div>
          <div class="kc-inline kc-inline-between">
            <span>Final Payable</span><strong id="total">0 EGP</strong>
          </div>
          <div id="pointsInfo" class="kc-muted">Points info will appear here.</div>
        </div>

        <div class="kc-inline kc-inline-between kc-section-spaced-sm">
          <button id="placeOrderBtn" type="button">Place Order</button>
        </div>
      </section>
    </main>

    <script type="module" src="../../app/features/clicker/ui/clicker-cart.js"></script>
  </body>
</html>
