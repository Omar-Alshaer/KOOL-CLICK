<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="application-name" content="Kool Click" />
    <meta name="theme-color" content="#3d005f" />
    <meta name="color-scheme" content="light" />
    <meta property="og:site_name" content="Kool Click" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kool Click | Profile" />
    <meta
      property="og:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta property="og:image" content="/public/assets/brand/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kool Click | Profile" />
    <meta
      name="twitter:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="twitter:image" content="/public/assets/brand/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/public/assets/brand/logo.svg" />
    <link rel="apple-touch-icon" href="/public/assets/brand/logo.svg" />
    <link rel="manifest" href="/public/site.webmanifest" />
    <title>Kool Click | Profile</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <main class="kc-shell">
      <header id="kcHeader"></header>

      <section class="kc-card kc-section-spaced">
        <h1 class="kc-title">Profile</h1>
        <div id="clickerMini"></div>
      </section>

      <section class="kc-card kc-section-spaced">
        <div class="kc-two">
          <div class="kc-item"><strong>Name:</strong> <span id="fullName"></span></div>
          <div class="kc-item kc-profile-username">
            <strong>Username:</strong>
            <span id="username"></span>
            <button id="editUsernameBtn" type="button" class="kc-btn-secondary kc-btn-compact">
              Edit
            </button>
          </div>
          <div class="kc-item"><strong>Phone:</strong> <span id="phone"></span></div>
          <div class="kc-item"><strong>Email:</strong> <span id="email"></span></div>
          <div class="kc-item"><strong>Birth Date:</strong> <span id="birthDate"></span></div>
          <div class="kc-item"><strong>Points:</strong> <span id="points"></span></div>
          <div class="kc-item">
            <strong>Level:</strong> <span id="level"></span> | Discount: <span id="discount"></span>
          </div>
        </div>
      </section>
    </main>

    <div id="usernameModal" class="kc-modal" aria-hidden="true">
      <div class="kc-modal-frame" role="dialog" aria-modal="true" aria-label="Edit Username">
        <div class="kc-modal-head">
          <h3 class="kc-title kc-title-no-margin">Edit Username</h3>
          <button id="closeUsernameModalBtn" type="button" class="kc-btn-secondary">Close</button>
        </div>
        <form id="usernameForm" class="kc-form">
          <div>
            <label for="newUsername">New Username</label>
            <input
              id="newUsername"
              type="text"
              placeholder="Enter new username (letters & numbers)"
              required
            />
          </div>
          <div class="kc-register-actions">
            <input type="submit" value="Save Username" />
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="../../app/features/clicker/ui/clicker-profile.js"></script>
  </body>
</html>
