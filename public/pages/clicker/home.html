<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kool Click | Home</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <main class="kc-shell">
      <header id="kcHeader"></header>

      <section class="kc-card kc-section-spaced">
        <h1 class="kc-title">Clicker Dashboard</h1>
        <div id="clickerMini"></div>
      </section>

      <section class="kc-three kc-section-spaced">
        <article class="kc-card">
          <h2 class="kc-title">Quick Actions</h2>
          <div class="kc-list">
            <a class="kc-btn" href="./menu.html">Browse Menu</a>
            <a class="kc-btn" href="./cart.html">Open Cart</a>
            <a class="kc-btn" href="./orders.html">Track Orders</a>
          </div>
        </article>

        <article class="kc-card">
          <h2 class="kc-title">Order Flow</h2>
          <p class="kc-muted" id="statusFlow"></p>
          <p class="kc-muted">Cashier can update status and remaining delivery time.</p>
        </article>

        <article class="kc-card">
          <h2 class="kc-title">Rewards Rule</h2>
          <p class="kc-muted">Every 50 EGP gives 5 points.</p>
          <p class="kc-muted">Higher levels unlock larger discounts.</p>
        </article>
      </section>

      <section id="offerBanner" class="kc-card kc-section-spaced-sm kc-offer-banner">
        <div class="kc-inline kc-inline-between kc-section-spaced-xs">
          <div>
            <h2 class="kc-title">Clicker Offers</h2>
            <p class="kc-subtitle">Fresh deals for every craving.</p>
          </div>
        </div>
        <div id="offerTrack" class="kc-offer-track"></div>
      </section>
    </main>

    <script type="module" src="../../js/clicker-home.js"></script>
  </body>
</html>
