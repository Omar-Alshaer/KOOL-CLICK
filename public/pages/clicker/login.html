<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="application-name" content="Kool Click" />
    <meta name="theme-color" content="#3d005f" />
    <meta name="color-scheme" content="light" />
    <meta property="og:site_name" content="Kool Click" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kool Click | Clicker Login" />
    <meta
      property="og:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta property="og:image" content="/public/assets/brand/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kool Click | Clicker Login" />
    <meta
      name="twitter:description"
      content="A pixel art food ordering platform for clickers, cashiers, managers, and system owners."
    />
    <meta name="twitter:image" content="/public/assets/brand/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/public/assets/brand/logo.svg" />
    <link rel="apple-touch-icon" href="/public/assets/brand/logo.svg" />
    <link rel="manifest" href="/public/site.webmanifest" />
    <title>Kool Click | Clicker Login</title>
    <link rel="stylesheet" href="../../css/app.css" />
  </head>
  <body>
    <main class="kc-shell">
      <header id="kcHeader" class="kc-login-header">
        <div class="kc-brand">
          <img src="../../assets/brand/logo_trans.svg" alt="Kool Click" />
          <div class="kc-brand-text">
            <span class="kc-brand-title">KOOL CLICK</span>
            <span class="kc-brand-slogan">Click. Order. Enjoy.</span>
          </div>
        </div>
      </header>

      <section class="kc-register-hero">
        <h1 class="kc-register-hero-title">Welcome Back, Clicker</h1>
        <p class="kc-register-hero-subtitle">Sign in to your Kool Click dashboard.</p>
        <div class="kc-register-rules">
          <span class="kc-chip">Fast food ordering</span>
          <span class="kc-chip">Live order status updates</span>
          <span class="kc-chip">Points, levels, and discounts</span>
        </div>
      </section>

      <section class="kc-card kc-login-card">
        <h2 class="kc-title">Clicker Login</h2>
        <p class="kc-subtitle">Use your email and password to sign in.</p>

        <form id="loginForm" class="kc-form kc-login-form">
          <div class="kc-login-field">
            <label for="identifier">Email</label>
            <input
              id="identifier"
              name="email"
              type="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />
          </div>

          <div class="kc-login-field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              minlength="6"
              autocomplete="current-password"
              required
            />
          </div>

          <div class="kc-register-actions">
            <input type="submit" value="Login" />
            <a class="kc-btn kc-btn-secondary" href="./register.html">Create Account</a>
          </div>
        </form>

        <a href="./forgot-password.html" class="kc-forgot-link">
          <span class="kc-forgot-icon">🔑</span>
          Forgot your password?
        </a>

        <p id="msg" class="kc-muted" aria-live="polite"></p>
      </section>

      <section style="display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; padding: 2rem 1rem; margin-top: 1rem;">
        <a href="../admin/login.html" class="kc-btn" style="padding: 0.35rem 0.6rem; font-size: 12px; min-height: auto;">👤 Admin</a>
        <a href="../cashier/login.html" class="kc-btn" style="padding: 0.35rem 0.6rem; font-size: 12px; min-height: auto;">💳 Cashier</a>
        <a href="../manager/login.html" class="kc-btn" style="padding: 0.35rem 0.6rem; font-size: 12px; min-height: auto;">📊 Manager</a>
      </section>
    </main>

    <script type="module" src="../../app/features/clicker/ui/clicker-login.js"></script>
  </body>
</html>
